name: Build Uploaded Source APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout uploaded source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build web bundle
        run: npm run build:web
      - name: Apply uploaded Android configuration
        run: node scripts/prepare-android.mjs
      - name: Sync uploaded Android project
        run: npx cap sync android
      - name: Verify uploaded source build
        run: node verify-build.js
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: uploaded-source-kira-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
